<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha conta | Luz da Lua Aromas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="topbar">✦ MINHA CONTA · LUZ DA LUA ✦</div>

<header class="site-header">
  <a class="logo" href="index.html">
    <span class="logo-main">luz da lua</span>
    <span class="logo-sub">A R O M A S</span>
  </a>
  <nav class="nav">
    <a href="index.html">Início</a>
    <a href="produtos.html">Catálogo</a>
    <a href="aromas.html">Aromas</a>
    <a class="active" href="conta.html">Minha conta</a>
    <a href="carrinho.html">Carrinho</a>
  </nav>
  <div class="header-actions">
    <a href="carrinho.html" class="round-btn cart-link">♡<span class="cart-badge">0</span></a>
    <button class="menu-btn">☰</button>
  </div>
</header>

<main class="account-page">
  <div id="accountRoot"></div>
</main>

<footer class="footer">
  <div>
    <div class="logo-main">luz da lua</div>
    <div class="logo-sub">A R O M A S</div>
    <p>Aromas que conectam.</p>
  </div>
  <div>
    <h4>Navegação</h4>
    <a href="produtos.html">Catálogo</a>
    <a href="aromas.html">Aromas</a>
    <a href="carrinho.html">Carrinho</a>
  </div>
  <div>
    <h4>Compra</h4>
    <a href="checkout.html">Finalizar pedido</a>
  </div>
  <div class="footer-bottom">© 2026 Luz da Lua Aromas</div>
</footer>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script>
function renderAccount(){
  const root = document.getElementById("accountRoot");
  const user = currentUser();

  if(user){
    const orders = JSON.parse(localStorage.getItem(ORDERS_KEY) || "[]")
      .filter(order=>order.userEmail===user.email)
      .reverse();

    root.innerHTML = `
      <div class="account-dashboard">
        <section class="account-welcome">
          <p class="eyebrow">ÁREA DO CLIENTE</p>
          <h1>Olá, <em>${user.name.split(" ")[0]}.</em></h1>
          <p>${user.email}</p>
          <div class="account-welcome-actions">
            <a class="btn light" href="produtos.html">Continuar comprando</a>
            <button class="btn gold" id="logoutBtn">Sair da conta</button>
          </div>
        </section>

        <section class="account-panels">
          <div class="account-panel">
            <div class="panel-heading">
              <h2>Meus pedidos</h2>
              <span>${orders.length} pedido(s)</span>
            </div>

            ${
              orders.length
              ? orders.map(order=>`
                  <a class="order-card" href="pedido.html?id=${order.id}">
                    <div>
                      <small>${order.id}</small>
                      <h3>${new Date(order.createdAt).toLocaleDateString("pt-BR")}</h3>
                    </div>
                    <div>
                      <span>${order.status}</span>
                      <strong>${money(order.total)}</strong>
                    </div>
                  </a>
                `).join("")
              : `
                <div class="empty-account">
                  <p>Você ainda não fez nenhum pedido.</p>
                  <a class="text-link" href="produtos.html">Explorar catálogo →</a>
                </div>
              `
            }
          </div>

          <aside class="account-panel account-mini">
            <h2>Seu carrinho</h2>
            <p>${getCart().reduce((sum,item)=>sum+item.qty,0)} item(ns) salvos nesta conta.</p>
            <a class="btn gold wide" href="carrinho.html">Abrir carrinho</a>
            <button class="outline-button wide" id="logoutBtn2">Sair</button>
          </aside>
        </section>
      </div>
    `;

    const logout = ()=>{
      logoutUser();
      location.reload();
    };

    document.getElementById("logoutBtn").onclick=logout;
    document.getElementById("logoutBtn2").onclick=logout;
    return;
  }

  root.innerHTML = `
    <div class="account-card">
      <p class="eyebrow dark">ÁREA DO CLIENTE</p>
      <h1>Entre ou crie<br><em>sua conta.</em></h1>
      <p class="account-intro">
        Salve seu carrinho, acompanhe seus pedidos e volte para comprar
        sem perder o que você escolheu.
      </p>

      <div class="account-tabs">
        <button class="account-tab active" data-panel="loginPanel">Entrar</button>
        <button class="account-tab" data-panel="registerPanel">Criar conta</button>
      </div>

      <section class="account-form-panel active" id="loginPanel">
        <form id="loginForm">
          <label>E-mail<input required type="email" name="email" placeholder="voce@email.com"></label>
          <label>Senha<input required type="password" name="password" placeholder="Sua senha"></label>
          <button class="btn gold wide">Entrar</button>
          <p class="form-message" id="loginMessage"></p>
        </form>
      </section>

      <section class="account-form-panel" id="registerPanel">
        <form id="registerForm">
          <label>Nome<input required name="name" placeholder="Seu nome"></label>
          <label>E-mail<input required type="email" name="email" placeholder="voce@email.com"></label>
          <label>Senha<input required type="password" name="password" minlength="6" placeholder="Mínimo de 6 caracteres"></label>
          <button class="btn gold wide">Criar conta</button>
          <p class="form-message" id="registerMessage"></p>
        </form>
      </section>

      <div class="account-benefits">
        <span>♡ Carrinho salvo</span>
        <span>✦ Pedidos organizados</span>
        <span>◌ Compra mais rápida</span>
      </div>
    </div>
  `;

  document.querySelectorAll(".account-tab").forEach(tab=>{
    tab.onclick=()=>{
      document.querySelector(".account-tab.active")?.classList.remove("active");
      tab.classList.add("active");
      document.querySelectorAll(".account-form-panel").forEach(panel=>panel.classList.remove("active"));
      document.getElementById(tab.dataset.panel).classList.add("active");
    };
  });

  document.getElementById("loginForm").onsubmit=event=>{
    event.preventDefault();
    const fd = new FormData(event.target);
    const result = loginUser(fd.get("email"),fd.get("password"));
    if(result.ok){
      location.reload();
      return;
    }
    document.getElementById("loginMessage").textContent = result.message;
  };

  document.getElementById("registerForm").onsubmit=event=>{
    event.preventDefault();
    const fd = new FormData(event.target);
    const result = registerUser(fd.get("name"),fd.get("email"),fd.get("password"));

    if(!result.ok){
      document.getElementById("registerMessage").textContent = result.message;
      return;
    }

    location.reload();
  };
}

document.addEventListener("DOMContentLoaded",renderAccount);
</script>
</body>
</html>
