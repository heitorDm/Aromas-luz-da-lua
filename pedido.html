<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Pedido | Luz da Lua Aromas</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="css/style.css"></head><body><div class="topbar">✦ PEDIDO DA LUZ DA LUA ✦</div><header class="site-header"><a class="logo" href="index.html"><span class="logo-main">luz da lua</span><span class="logo-sub">A R O M A S</span></a><nav class="nav"><a href="index.html">Início</a><a href="produtos.html">Catálogo</a><a href="conta.html">Minha conta</a></nav><div class="header-actions"><a href="carrinho.html" class="round-btn cart-link">♡<span class="cart-badge">0</span></a></div></header><main class="order-page" id="orderPage"></main><footer class="footer"><div><div class="logo-main">luz da lua</div><div class="logo-sub">A R O M A S</div><p>Aromas que conectam.</p></div><div class="footer-bottom">© 2026 Luz da Lua Aromas</div></footer><script src="js/data.js"></script><script src="js/app.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{const id=new URLSearchParams(location.search).get("id"),orders=JSON.parse(localStorage.getItem(ORDERS_KEY)||"[]"),o=orders.find(x=>x.id===id)||orders.at(-1),root=document.getElementById("orderPage");if(!o){root.innerHTML=`<section class="page-title"><p class="eyebrow dark">PEDIDO</p><h1>Nenhum pedido<br><em>encontrado.</em></h1></section>`;return;}root.innerHTML=`<section class="order-success"><div class="success-icon">✓</div><p class="eyebrow dark">PEDIDO ${o.id}</p><h1>Pedido enviado<br><em>para o WhatsApp.</em></h1><p>A mensagem com seus produtos, endereço e forma de pagamento foi aberta no WhatsApp da Luz da Lua.</p><div class="order-status"><span>Status</span><strong>${o.status}</strong></div><div class="order-recap">${o.items.map(i=>`<div><span>${i.name} × ${i.qty}<small>${i.aroma}</small></span><strong>${money(i.price*i.qty)}</strong></div>`).join("")}<div class="order-total"><span>Total</span><strong>${money(o.total)}</strong></div></div><div class="order-actions"><a class="btn gold" href="index.html">Voltar à loja</a><a class="btn outline-dark" href="conta.html">Minha conta</a></div></section>`});</script></body></html>
